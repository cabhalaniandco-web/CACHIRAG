name: TDL checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Structural checks
        run: python3 tools/test_tdl_lint.py
      - name: GSTR-2B importer behaviour
        run: python3 tools/test_gstr2b_import.py
